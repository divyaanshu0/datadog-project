version: "3.8"

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:     
      context: ./backend
      dockerfile: backend.Dockerfile
    container_name: backend_service
    restart: always
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      - db

  frontend:
   build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
   container_name: frontend_service
   restart: always
   env_file:
      - .env
   ports:
      - "${FRONTEND_PORT}:3000"
   depends_on:
      - backend

volumes:
   postgres_data:



